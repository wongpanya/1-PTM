schema_version: 0.1
prototype_notice_th: ระบบนี้ยังเป็น Prototype เพื่อสาธิตแนวคิดเชิงนโยบาย ไม่ใช่ Production System
minimum_group_size: 5
roles:
  Admin:
    can_import: true
    can_export_aggregate: true
    can_view_audit: true
    can_predict_individual: false
    can_review_individual: false
    can_approve_individual: false
    can_view_individual_audit: true
    description_th: ผู้ดูแลระบบต้นแบบและข้อมูล
  Analyst:
    can_import: false
    can_export_aggregate: true
    can_view_audit: true
    can_predict_individual: false
    can_review_individual: false
    can_approve_individual: false
    can_view_individual_audit: false
    description_th: นักวิเคราะห์ที่ดูผลรวมและส่งออกข้อมูล aggregate ได้
  Viewer:
    can_import: false
    can_export_aggregate: false
    can_view_audit: false
    can_predict_individual: false
    can_review_individual: false
    can_approve_individual: false
    can_view_individual_audit: false
    description_th: ผู้ชมผลลัพธ์รวม ไม่เห็นเมนูนำเข้าข้อมูลและไม่ส่งออกข้อมูล
  CaseOfficer:
    can_import: false
    can_export_aggregate: false
    can_view_audit: false
    can_predict_individual: true
    can_review_individual: false
    can_approve_individual: false
    can_view_individual_audit: false
    description_th: เจ้าหน้าที่ผู้สร้างคำขอพยากรณ์และดูเฉพาะเคสที่ตนสร้าง
  HumanReviewer:
    can_import: false
    can_export_aggregate: false
    can_view_audit: false
    can_predict_individual: false
    can_review_individual: true
    can_approve_individual: false
    can_view_individual_audit: false
    description_th: ผู้ตรวจข้อมูลและผลโมเดล มีสิทธิ์ยืนยัน override หรือขอข้อมูลเพิ่ม
  DomainApprover:
    can_import: false
    can_export_aggregate: false
    can_view_audit: false
    can_predict_individual: false
    can_review_individual: false
    can_approve_individual: true
    can_view_individual_audit: false
    description_th: ผู้เชี่ยวชาญที่อนุมัติแผนช่วยเหลือหลัง Human review
  ModelOwner:
    can_import: false
    can_export_aggregate: true
    can_view_audit: true
    can_predict_individual: false
    can_review_individual: false
    can_approve_individual: false
    can_view_individual_audit: false
    description_th: ผู้ดูแล Model registry ประสิทธิภาพ calibration และ threshold
  DPOAuditor:
    can_import: false
    can_export_aggregate: false
    can_view_audit: true
    can_predict_individual: false
    can_review_individual: false
    can_approve_individual: false
    can_view_individual_audit: true
    description_th: ผู้ตรวจวัตถุประสงค์ สิทธิ์ การเข้าถึง และ Audit trail
export:
  allowed_scope: aggregate_only
  allowed_formats: [csv]
  export_log_path: data/processed/export_log.jsonl
data_use_notice:
  - ใช้ข้อมูลเพื่อสาธิตระบบสนับสนุนนโยบายเท่านั้น
  - ห้ามใช้ผลลัพธ์ Prototype เพื่อตัดสินใจจัดสรรทุนอัตโนมัติ
  - ห้ามส่งออกหรือเปิดเผยข้อมูลระดับบุคคล
  - กลุ่มข้อมูลที่มีจำนวนน้อยกว่า minimum group size ต้องถูกปกปิด
