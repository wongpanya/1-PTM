  - สถานภาพปัจจุบัน (ล่าสุด)
  - ประเทศ
  - กลุ่มสาขาวิชา (ปัจจุบัน)
  - ประเภทการประกอบอาชีพ
column_indexes:
  source_id: 1
  province_code: 5
  economic_corridor: 6
  region: 7
  province: 8
  district: 9
  sex: 10
  cohort: 11
  round: 12
  scholarship_type: 13
  birth_year_be: 20
  study_start_date: 34
  study_end_dropout_date: 35
