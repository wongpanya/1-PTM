  restart_thailand_date: 43
  project_condition_status: 44
  overall_status: 45
  after_m6_status: 46
  current_status: 47
  current_continent: 48
  current_country: 49
  current_field_group: 50
  current_field: 51
  current_university: 52
  latest_degree: 63
  gpa_raw: 64
  employment_type: 84
  employment_detail: 85
  workplace_province_country: 94
  work_start_date: 97
  income_raw: 98
  domicile_employment_relation: 102
  field_job_fit: 103
  local_fit: 104
  job_satisfaction: 105
  wants_government: 106
dictionary_columns:
  country: 3
  field_group: 5
  employment_type: 6
  education_status: 27
  overall_status: 28
  after_m6_status: 29
  current_status: 30
  economic_corridor: 31
validation:
  income_min: 0
  income_max: 500000
  completeness_key_fields:
    - odos_uid
    - cohort
    - province
    - district
    - project_condition_status
    - current_country
    - current_field_group
    - employment_type
  dictionary_checks:
    current_country: country
    current_field_group: field_group
    employment_type: employment_type
    project_condition_status: education_status
    overall_status: overall_status
    after_m6_status: after_m6_status
    current_status: current_status
    economic_corridor: economic_corridor
  dictionary_aliases:
    economic_corridor:
      - NeEC
      - NEC
      - CWEC
      - SEC
      - EEC
      - SEC-Landbridge
  cross_field_rules:
    - completed_without_employment
    - employed_without_work_start_date
    - graduated_with_dropout_date
    - risk_status_marked_employed
outputs:
  directory: data/processed/phase4
  cleaned_dataset: cleaned_modeling_dataset_no_pii.csv
  rejected_dataset: validation_issues.csv
  processing_log: processing_log.jsonl
  before_after_report_json: before_after_report.json
  before_after_report_md: before_after_report.md
  field_cleaning_report: field_cleaning_report.csv
