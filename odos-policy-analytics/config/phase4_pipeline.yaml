schema_version: 0.2
cleaning_rules_path: config/cleaning_rules.yaml
source:
  default_excel_path: ../phase1_outputs/raw/690724 DB_ODOS Students+.xlsx
  data_sheet: DB_Students
  dictionary_sheet: Remark
  header_row: 1
  first_data_row: 2
  raw_file_policy: read_only
required_sheets:
  - DB_Students
  - Remark
required_columns:
  - ID
  - จังหวัด
  - อำเภอ
  - เพศ
  - รุ่นที่
  - สถานตามเงื่อนไข โครงการ
