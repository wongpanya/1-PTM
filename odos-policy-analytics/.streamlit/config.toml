[theme]
base = "light"
primaryColor = "#7C3AED"
backgroundColor = "#F7F9FC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1F2937"
linkColor = "#6D28D9"
borderColor = "#E5EAF2"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "8px"
buttonRadius = "8px"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@600;700&display=swap"
baseFontSize = 14
headingFontSizes = ["28px", "22px", "18px", "16px", "14px", "12px"]
headingFontWeights = [700, 600, 600, 600, 600, 600]
redColor = "#EF4444"
orangeColor = "#F59E0B"
yellowColor = "#EAB308"
greenColor = "#10B981"
blueColor = "#06B6D4"
violetColor = "#7C3AED"
grayColor = "#64748B"
chartCategoricalColors = ["#7C3AED", "#06B6D4", "#10B981", "#F59E0B", "#A78BFA", "#22D3EE", "#34D399"]
chartSequentialColors = ["#F5F3FF", "#EDE9FE", "#DDD6FE", "#C4B5FD", "#A78BFA", "#8B5CF6", "#7C3AED", "#6D28D9", "#5B21B6", "#4C1D95"]
dataframeBorderColor = "#E5EAF2"
dataframeHeaderBackgroundColor = "#F4F2FF"

[theme.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F2FF"
textColor = "#1F2937"
primaryColor = "#7C3AED"
borderColor = "#E9E4F5"

[client]
showSidebarNavigation = true
